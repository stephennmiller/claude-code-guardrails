name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    # The repo's own thesis is "test your hooks -- their failure mode is
    # silence." A guardrails repo without this job would not be credible.
    name: hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not redundant: the guards use bash regex and BSD vs GNU
        # userland differ (sed -i, grep flags, awk). Most contributors are on
        # macOS; most CI is Linux. Both have to stay green.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install jq
        # jq builds the hook input envelopes. Without it the shell guards no-op
        # and every assertion would trivially "pass" -- so the harness refuses
        # to run rather than reporting a false green.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
          fi
          jq --version

      - name: Report bash version
        # macOS runners historically shipped bash 3.2, which lacks features the
        # guards rely on. Printing it makes a version-specific failure obvious.
        run: bash --version | head -1

      - name: Run the hook harness
        run: bash .claude/hooks/test-hooks.sh

      - name: Run the harness under stock macOS bash 3.2
        # macOS still ships bash 3.2 at /bin/bash, and a shebang of
        # `#!/bin/bash` gets that, not whatever brew put in PATH. Anyone on a
        # stock Mac runs the guards under 3.2, so it has to stay supported.
        if: runner.os == 'macOS'
        run: /bin/bash .claude/hooks/test-hooks.sh

      - name: Verify the harness actually detects a broken guard
        # A suite that has never failed has not been shown to work. Break a
        # guard on purpose and assert the harness goes red.
        shell: bash
        run: |
          cp .claude/hooks-scripts/blast-radius-guard.py /tmp/guard.bak
          python3 - <<'PY'
          p = ".claude/hooks-scripts/blast-radius-guard.py"
          s = open(p).read()
          old = "def check_bash(command: str) -> int:\n    if not command:"
          new = "def check_bash(command: str) -> int:\n    return 0\n    if not command:"
          assert old in s, "sabotage target not found -- update this step"
          open(p, "w").write(s.replace(old, new, 1))
          PY
          if bash .claude/hooks/test-hooks.sh >/dev/null 2>&1; then
            echo "::error::harness passed against a deliberately broken guard"
            cp /tmp/guard.bak .claude/hooks-scripts/blast-radius-guard.py
            exit 1
          fi
          echo "harness correctly detected the broken guard"
          cp /tmp/guard.bak .claude/hooks-scripts/blast-radius-guard.py

      - name: Install into a scratch repo
        # Exercises the path most users take first. Catches the class of bug
        # where a stray file breaks `cp` and aborts a `set -e` install midway.
        shell: bash
        run: |
          TARGET="$(mktemp -d)/scratch"
          mkdir -p "$TARGET/.claude"
          printf '{}' > "$TARGET/package.json"
          printf '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"echo existing"}]}]}}' \
            > "$TARGET/.claude/settings.json"
          ./install.sh "$TARGET"
          # The pre-existing hook must survive the merge.
          grep -q "echo existing" "$TARGET/.claude/settings.json" \
            || { echo "::error::install clobbered an existing hook"; exit 1; }
          # And a second run must be a no-op. Captured rather than piped into
          # `grep -q`: grep exits on the first match and closes the pipe, which
          # can EPIPE the still-writing installer and fail the pipeline under
          # pipefail. That race is flaky by construction.
          SECOND="$(./install.sh "$TARGET")"
          grep -q "0 hook(s) added" <<<"$SECOND" \
            || { echo "::error::install is not idempotent"; echo "$SECOND"; exit 1; }
          # The template is the only thing that teaches a user which rules are
          # worth writing. It was linked from the README and shipped nowhere,
          # so an installed repo never saw it.
          test -f "$TARGET/.claude/CLAUDE.md.template" \
            || { echo "::error::install did not ship the CLAUDE.md template"; exit 1; }
          # Reinstall must refresh an untouched file and never clobber an
          # edited one. Provenance comes from .guardrails-manifest: comparing
          # against the current shipped file cannot tell "user edited this"
          # from "this is an older copy of ours" -- both merely differ.
          printf '\n<!-- upstream -->\n' >> templates/CLAUDE.md.template
          ./install.sh "$TARGET" >/dev/null
          grep -q "upstream" "$TARGET/.claude/CLAUDE.md.template" \
            || { echo "::error::an unmodified template was not refreshed"; exit 1; }
          printf '\n<!-- mine -->\n' >> "$TARGET/.claude/CLAUDE.md.template"
          printf '\n<!-- upstream two -->\n' >> templates/CLAUDE.md.template
          ./install.sh "$TARGET" >/dev/null
          grep -q "mine" "$TARGET/.claude/CLAUDE.md.template" \
            || { echo "::error::install clobbered a locally edited template"; exit 1; }
          git checkout templates/CLAUDE.md.template

      - name: Upgrade an install that predates a guard rename
        # A merge preserves what is already wired, which is right for a user's
        # own hooks and wrong for one of ours that was renamed: the stale entry
        # keeps pointing at the old file, still on disk, so the repo runs BOTH
        # the old guard and its replacement. Every other test installs into an
        # empty directory, so nothing exercised this.
        shell: bash
        run: |
          set -euo pipefail
          OLD="$(mktemp -d)/old"
          mkdir -p "$OLD/.claude/hooks-scripts"
          printf 'exit 0\n' > "$OLD/.claude/hooks-scripts/git-safety.sh"
          printf 'exit 0\n' > "$OLD/.claude/hooks-scripts/my-own-guard.sh"
          chmod +x "$OLD/.claude/hooks-scripts/"*.sh
          cat > "$OLD/.claude/settings.json" <<'JSON'
          {"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[
            {"type":"command","command":"\"$CLAUDE_PROJECT_DIR/.claude/hooks-scripts/git-safety.sh\""},
            {"type":"command","command":"\"$CLAUDE_PROJECT_DIR/.claude/hooks-scripts/my-own-guard.sh\""}
          ]}]}}
          JSON
          ./install.sh "$OLD" >/dev/null
          grep -q 'git-safety.py' "$OLD/.claude/settings.json" \
            || { echo "::error::the replacement guard was not wired"; exit 1; }
          if grep -q 'git-safety.sh' "$OLD/.claude/settings.json"; then
            echo "::error::stale guard entry survived the upgrade"; exit 1
          fi
          test ! -f "$OLD/.claude/hooks-scripts/git-safety.sh" \
            || { echo "::error::retired guard file left on disk"; exit 1; }
          # A hook the USER added must never be pruned.
          grep -q 'my-own-guard.sh' "$OLD/.claude/settings.json" \
            || { echo "::error::install pruned a user's own hook"; exit 1; }
          test -f "$OLD/.claude/hooks-scripts/my-own-guard.sh" \
            || { echo "::error::install deleted a user's own script"; exit 1; }

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: shellcheck
        # Blocking at -S warning, which catches error and warning severity and
        # is currently clean. Verified to actually fail: an injected SC2164
        # (`cd` with no error handling) exits 1. Note that info-level findings
        # such as SC2086 (unquoted variable) sit BELOW this threshold and will
        # not fail the build -- drop to -S info if you want those too, after
        # clearing the three deliberate findings below warning: a single-quoted
        # grep pattern (SC2016) and two `sed 's/^/  /'` indents (SC2001).
        #
        # Pinned to an exact release with a checksum, NOT apt. `apt-get install
        # shellcheck` floats with the runner image, so a required check could
        # turn red on a PR that changed nothing -- and `shellcheck=<version>`
        # is not a fix, since it only pins to whatever Ubuntu currently
        # packages. Bump SC_VERSION and SC_SHA256 together, deliberately.
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o shellcheck.tar.xz
          echo "${SC_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SC_VERSION}"
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -S warning

      - name: python syntax
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 \
            | xargs -0 -n1 python3 -m py_compile
          echo "all python files parse"

      - name: json validity
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -c "import json,sys;json.load(open('$f'))" || exit 1
          done
          echo "all json files parse"

  verify:
    name: repo self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Docs, config regexes, and hook wiring
        # Three silent failure modes the harness cannot see: a rule whose regex
        # does not compile is dropped at runtime with a warning nobody reads; a
        # guard missing from settings.json protects nothing; a doc naming a
        # moved file sends the next reader somewhere useless.
        run: bash scripts/verify-repo.sh

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The guards use PEP 585 builtin generics (list[Rule], tuple[str, ...])
        # in annotations, which are evaluated at import on every version here.
        # 3.9 is the floor; this matrix is what makes that claim true rather
        # than assumed.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Guards import and the suite passes
        run: |
          python3 -V
          for f in .claude/hooks-scripts/*.py; do python3 -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('m', '$f')
          spec.loader.exec_module(importlib.util.module_from_spec(spec))
          " || { echo "::error::$f fails to import on Python ${{ matrix.python }}"; exit 1; }
          done
          bash .claude/hooks/test-hooks.sh
